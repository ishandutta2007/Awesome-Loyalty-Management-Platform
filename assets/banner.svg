<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #ffffff;
      }
      
      /* Dynamic SVG CSS animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      
      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-delayed {
        animation: floatSlow 7s ease-in-out 1.5s infinite;
      }
      .glowing-orb {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .animated-line {
        stroke-dasharray: 8 6;
        animation: dashMove 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="100" r="140" fill="#4f46e5" class="glowing-orb" filter="url(#glow)" opacity="0.3" />
  <circle cx="1050" cy="260" r="160" fill="#c084fc" class="glowing-orb" filter="url(#glow)" opacity="0.25" />

  <!-- Animated Decorative Grid Lines -->
  <path d="M 50 0 V 360 M 150 0 V 360 M 250 0 V 360 M 350 0 V 360 M 450 0 V 360" stroke="#334155" stroke-width="1" opacity="0.2" />
  <path d="M 0 80 H 1200 M 0 180 H 1200 M 0 280 H 1200" stroke="#334155" stroke-width="1" opacity="0.2" />
  
  <line x1="100" y1="290" x2="1100" y2="290" stroke="url(#accentGrad)" stroke-width="2" class="animated-line" opacity="0.6" />

  <!-- Left Side: Title & Subtitle -->
  <g transform="translate(80, 120)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#10b981" />
    <text x="32" y="21" class="badge-text">ECOSYSTEM CURATION</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Loyalty Management</text>
    <text x="0" y="130" class="title" fill="url(#accentGrad)">Platform &amp; Engine Stack</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">SaaS Products • Open-Source Engines • Points Ledgers • VIP Tiers</text>
  </g>

  <!-- Right Side: Graphic Representation of Loyalty Elements -->
  <!-- Card 1: VIP Loyalty Card -->
  <g class="floating-card" transform="translate(800, 70)">
    <rect width="260" height="150" rx="14" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" opacity="0.9" />
    <!-- Card Chip & Details -->
    <rect x="24" y="24" width="36" height="26" rx="4" fill="url(#goldGrad)" />
    <circle cx="216" cy="37" r="14" fill="#ec4899" opacity="0.8" />
    <circle cx="200" cy="37" r="14" fill="#8b5cf6" opacity="0.8" />
    <text x="24" y="95" font-family="sans-serif" font-weight="700" font-size="16" fill="#ffffff" letter-spacing="2">GOLD VIP TIER</text>
    <text x="24" y="122" font-family="sans-serif" font-size="13" fill="#94a3b8">Points Balance: 12,450 pts</text>
  </g>

  <!-- Card 2: Rewards Floating Badge -->
  <g class="floating-card-delayed" transform="translate(730, 180)">
    <rect width="200" height="110" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <circle cx="36" cy="40" r="16" fill="#38bdf8" opacity="0.2" />
    <text x="31" y="46" font-family="sans-serif" font-size="18" fill="#38bdf8">🎁</text>
    <text x="66" y="38" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">Reward Earned</text>
    <text x="66" y="54" font-family="sans-serif" font-size="12" fill="#64748b">Order #48291</text>
    <line x1="20" y1="75" x2="180" y2="75" stroke="#334155" stroke-width="1" />
    <text x="20" y="94" font-family="sans-serif" font-weight="700" font-size="13" fill="#10b981">+500 Points Ledger</text>
  </g>
</svg>
